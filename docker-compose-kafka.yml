services:
  product:
    depends_on:
      kafka:
        condition: service_started
      mongodb:
        condition: service_healthy
    build: microservices/product-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka,streaming_partitioned,streaming_instance_0

  product-p1:
    depends_on:
      kafka:
        condition: service_started
      mongodb:
        condition: service_healthy
    build: microservices/product-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka,streaming_partitioned,streaming_instance_1

  recommendation:
    depends_on:
      kafka:
        condition: service_started
      mongodb:
        condition: service_healthy
    build: microservices/recommendation-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka,streaming_partitioned,streaming_instance_0

  recommendation-p1:
    depends_on:
      kafka:
        condition: service_started
      mongodb:
        condition: service_healthy
    build: microservices/recommendation-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka,streaming_partitioned,streaming_instance_1

  review:
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    build: microservices/review-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka,streaming_partitioned,streaming_instance_0

  review-p1:
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    build: microservices/review-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka,streaming_partitioned,streaming_instance_1

  product-composite:
    depends_on:
      kafka:
        condition: service_started
    build: microservices/product-composite-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka,streaming_partitioned

  mongodb:
    image: mongo:8.0.5
    mem_limit: 512m
    ports:
      - "127.0.0.1:27017:27017"
    command: mongod
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 2s
      retries: 60

  mysql:
    image: mysql:9.2.0
    mem_limit: 512m
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpwd
      - MYSQL_DATABASE=review-db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pwd
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=user --password=pwd --execute='SHOW DATABASES;'"]
      interval: 5s
      timeout: 2s
      retries: 60

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    restart: always
    mem_limit: 1024m
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_BROKER_ID=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    restart: always
    mem_limit: 512m
    ports:
      - "127.0.0.1:2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
  eureka:
    build: spring-cloud/eureka-server
    mem_limit: 512m

  gateway:
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    build: spring-cloud/gateway
    mem_limit: 512m
    ports:
      - "8080:8080"
