management.endpoint.health.show-details: always
management.endpoints.web.exposure.include: "*"

spring.application.name: product

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    initialInstanceInfoReplicationIntervalSeconds: 5
    registryFetchIntervalSeconds: 5
  instance:
    leaseRenewalIntervalInSeconds: 5
    leaseExpirationDurationInSeconds: 5

server:
  port: 7002

logging:
  level:
    root: INFO
    se.magnus.microservices: DEBUG

spring:
  web:
    error:
      include-message: always
spring.data.mongodb.auto-index-creation: true
spring.mongodb:
  host: localhost
  port: 27017
  database: product-db

logging.level.org.springframework.data.mongodb.core.MongoTemplate: DEBUG

spring.cloud.stream:
  default-binder: rabbit
  default.content-type: application/json
  bindings.messageProcessor-in-0:
    destination: products
    group: productsGroup
    consumer:
      max-attempts: 3
      back-off-initial-interval: 500
      back-off-max-interval: 1000
      back-off-multiplier: 2.0
  rabbit.bindings.messageProcessor-in-0.consumer:
    auto-bind-dlq: true
    republish-to-dlq: true
  kafka.bindings.messageProcessor-in-0.consumer:
    enable-dlq: true

spring.cloud.stream.kafka.binder:
  brokers: 127.0.0.1
  default-broker-port: 9092

spring.rabbitmq:
  host: 127.0.0.1
  port: 5672
  username: guest
  password: guest

---
spring:
  config:
    activate:
      on-profile: docker

eureka.client.serviceUrl.defaultZone: http://eureka:8761/eureka/

server:
  port: 8080

spring.mongodb.host: mongodb

spring.rabbitmq.host: rabbitmq
spring.cloud.stream.kafka.binder.brokers: kafka

---
spring.config.activate.on-profile: streaming_partitioned
spring.cloud.stream.bindings.messageProcessor-in-0.consumer:
  partitioned: true
  instance-count: 2

---
spring.config.activate.on-profile: streaming_instance_0
spring.cloud.stream.bindings.messageProcessor-in-0.consumer.instance-index: 0

---
spring.config.activate.on-profile: streaming_instance_1
spring.cloud.stream.bindings.messageProcessor-in-0.consumer.instance-index: 1

---
spring.config.activate.on-profile: kafka
spring.cloud.stream.default-binder: kafka
management.health.rabbit.enabled: false
